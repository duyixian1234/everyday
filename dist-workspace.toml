[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.32) — see docs/adr/G001-quality-tools-suite.md.
# This file is the source of truth for the release pipeline; release.yml is
# machine-generated by `dist generate` — do NOT hand-edit it.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (curl | sh / PowerShell)
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# 3 platforms / 4 architectures — Linux x86_64, macOS x86_64 + aarch64, Windows x86_64.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Sigstore provenance for every artifact (public repo -> Rekor public ledger).
# Verify with: gh attestation verify <artifact> --repo duyixian1234/everyday
github-attestations = true
